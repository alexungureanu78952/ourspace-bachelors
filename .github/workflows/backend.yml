name: Backend quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ourspace_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: ourspace_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourspace_test -d ourspace_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OURSPACE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=ourspace_test_admin;Username=ourspace_test;Password=ci-test-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-backend.mjs
