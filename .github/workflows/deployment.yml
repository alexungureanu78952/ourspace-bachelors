name: Local Docker deployment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run local:up
      - run: npm run test:deployment
      - run: npm run local:backup
      - name: Verify restore into scratch databases
        shell: bash
        run: npm run local:verify-backup -- "$(find .local/backups -mindepth 1 -maxdepth 1 -type d | head -1)"
      - if: always()
        run: docker compose -f infra/compose.yml ps --all
      - if: always()
        run: docker compose -f infra/compose.yml down
